<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff4f7">
<title>Dim's Shelves</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23ff6f9c'/><path d='M42 33v34l26-17z' fill='white'/></svg>">
<style>
:root{
  --bg:#fff7f9; --ink:#1d1d1f; --ink2:#86868b; --ink3:#b3a8ad;
  --accent:#ff5c8d; --accent-soft:rgba(255,92,141,.10);
  --glass:rgba(255,247,249,.72); --pop:rgba(255,255,255,.55); --pop-ink:#1d1d1f;
  --blob1:#ffd3e0; --blob2:#ffe6ee; --blob3:#fde2f0;
  --shadow:0 18px 40px -18px rgba(214,90,130,.45), 0 4px 12px -6px rgba(214,90,130,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140e11; --ink:#f5f0f2; --ink2:#a39a9e; --ink3:#6d6267;
    --accent:#ff7aa3; --accent-soft:rgba(255,122,163,.14);
    --glass:rgba(20,14,17,.68); --pop:rgba(30,20,25,.55); --pop-ink:#fff;
    --blob1:#4a1f30; --blob2:#2d1520; --blob3:#3a1a2a;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7), 0 4px 12px -6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#140e11; --ink:#f5f0f2; --ink2:#a39a9e; --ink3:#6d6267;
  --accent:#ff7aa3; --accent-soft:rgba(255,122,163,.14);
  --glass:rgba(20,14,17,.68); --pop:rgba(30,20,25,.55); --pop-ink:#fff;
  --blob1:#4a1f30; --blob2:#2d1520; --blob3:#3a1a2a;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7), 0 4px 12px -6px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.9}
.ambient i:nth-child(1){width:60vw;height:60vw;left:-15vw;top:-20vw;background:var(--blob1)}
.ambient i:nth-child(2){width:50vw;height:50vw;right:-15vw;top:10vh;background:var(--blob3)}
.ambient i:nth-child(3){width:70vw;height:40vw;left:15vw;bottom:-20vw;background:var(--blob2)}

.top{position:sticky;top:0;z-index:10;background:var(--glass);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
.top .in{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;gap:16px;align-items:center}
.top .brand{font-weight:600;font-size:15px;color:var(--ink2);white-space:nowrap}
.top .brand b{color:var(--accent);font-weight:600}
#q{margin-left:auto;width:min(280px,100%);border:0;outline:0;font:inherit;font-size:14px;color:var(--ink);
  background:var(--accent-soft);border-radius:10px;padding:8px 12px}
#q::placeholder{color:var(--ink2)}

.wrap{max-width:1240px;margin:0 auto;padding:34px 16px 80px}
h1{font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.05;display:flex;gap:.55em;flex-wrap:wrap}
h1 button{all:unset;cursor:pointer;color:var(--ink3);transition:color .25s}
h1 button:hover{color:var(--ink2)}
h1 button.on{color:var(--ink)}
.lede{color:var(--ink2);font-size:15px;margin:8px 0 26px}
.tags{display:flex;gap:4px 6px;flex-wrap:wrap;margin-bottom:34px}
.chip{border:0;background:none;font:inherit;font-size:14px;color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:38px 26px}
.grid.square{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:30px 22px}
.grid.square .art{aspect-ratio:1/1;border-radius:10px}
.item{min-width:0}
.art{position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow);background:var(--accent-soft);
  transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1), filter .35s}
.item:hover .art{transform:translateY(-3px)}
.item:hover .art img{transform:scale(1.035)}
.play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:grid;place-items:center;opacity:0;transform:scale(.85);transition:.3s cubic-bezier(.2,.8,.2,1)}
.play::before{content:"";border-left:11px solid var(--accent);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.item:hover .play{opacity:1;transform:none}
@media (hover:none){.play{opacity:1;transform:none}}

.pick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--pop);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  opacity:0;pointer-events:none;transition:opacity .28s}
.item.open .pick{opacity:1;pointer-events:auto}
.item.open .art img{filter:saturate(1.1)}
.pick a{text-decoration:none;color:var(--pop-ink);font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.55);transform:translateY(6px);transition:transform .35s cubic-bezier(.2,.8,.2,1), background .2s}
.item.open .pick a{transform:none}
.pick a:hover{background:#fff}
.pick a span{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.pick a.bili span{background:#fb7299} .pick a.yt span{background:#ff3b30}

.t{margin-top:12px;font-size:14.5px;font-weight:500;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{margin-top:3px;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s em{font-style:normal;color:var(--ink3)}
.empty{color:var(--ink2);padding:80px 0;text-align:center}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:30px 0 50px}
@media (max-width:560px){.grid,.grid.square{grid-template-columns:1fr 1fr;gap:26px 14px}.t{font-size:13.5px}.s{font-size:12px}.top .brand{display:none}#q{width:100%}}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div>
<div class="top"><div class="in">
  <div class="brand">Dim's <b>Shelves</b></div>
  <input id="q" placeholder="搜索" autocomplete="off" type="search">
</div></div>
<main class="wrap">
  <h1 id="shelves"></h1>
  <p class="lede" id="count"></p>
  <div class="tags" id="tags"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>还什么都没有</div>
</main>
<footer>♡</footer>
<script>
const NAMES = {bili: "哔哩哔哩", yt: "YouTube"};
let items = [], active = null, shelf = decodeURIComponent(location.hash.slice(1)) || null;
const SHELF = i => i.shelf || "音乐";
const SQUARE = new Set(["听歌"]);  // 几乎没画面的歌：按专辑方块显示
const inShelf = () => items.filter(i => SHELF(i) === shelf);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : "";

function renderShelves(){
  const names = [...new Set(items.map(SHELF))];
  if (!names.includes(shelf)) shelf = names[0];
  $("#shelves").innerHTML = names.map(n => `<button class="${n===shelf?"on":""}" data-shelf="${esc(n)}">${esc(n)}</button>`).join("");
}
function renderTags(){
  const n = {};
  inShelf().forEach(i => i.tags.forEach(t => n[t] = (n[t]||0)+1));
  const ts = Object.keys(n).sort((a,b)=>n[b]-n[a]);
  $("#tags").innerHTML = ts.length ? [`<button class="chip ${active?"":"on"}" data-t="">全部</button>`,
    ...ts.map(t => `<button class="chip ${active===t?"on":""}" data-t="${esc(t)}">${esc(t)}</button>`)].join("") : "";
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const list = inShelf().filter(i => (!active || i.tags.includes(active)) &&
    (!q || (i.title+" "+(i.name||"")+" "+(i.sub||"")+" "+i.uploader+" "+i.tags.join(" ")+" "+Object.values(i.sources).map(s=>s.title+" "+s.uploader).join(" ")).toLowerCase().includes(q)));
  $("#count").textContent = `${inShelf().length} ${SQUARE.has(shelf) ? "首" : "个视频"}`;
  $("#grid").classList.toggle("square", SQUARE.has(shelf));
  $("#empty").hidden = list.length > 0;
  $("#grid").innerHTML = list.map(i => {
    const src = Object.entries(i.sources);
    const one = src.length === 1;
    const pick = one ? "" : `<div class="pick">${src.map(([p,s]) =>
      `<a class="${p}" href="${esc(s.url)}" target="_blank" rel="noopener"><span></span>${NAMES[p]||p}</a>`).join("")}</div>`;
    return `<div class="item">
      <a class="art" ${one ? `href="${esc(src[0][1].url)}" target="_blank" rel="noopener"` : `role="button" tabindex="0" data-multi`}>
        ${i.cover ? `<img loading="lazy" src="${esc(i.cover)}" alt="">` : ""}
        <span class="play"></span>${pick}
      </a>
      <div class="t" title="${esc(i.title)}">${esc(i.name || i.title)}</div>
      <div class="s">${esc(i.sub ?? i.uploader)}${i.duration ? ` <em>· ${fmt(i.duration)}</em>` : ""}</div>
    </div>`;
  }).join("");
}
document.addEventListener("click", e => {
  const sh = e.target.closest("[data-shelf]");
  if (sh){ shelf = sh.dataset.shelf; active = null; history.replaceState(null, "", "#" + encodeURIComponent(shelf)); renderShelves(); renderTags(); render(); return; }
  const chip = e.target.closest(".chip");
  if (chip){ active = chip.dataset.t || null; renderTags(); render(); return; }
  if (e.target.closest(".pick a")) return;
  const multi = e.target.closest("[data-multi]");
  const opened = document.querySelector(".item.open");
  if (opened && (!multi || opened !== multi.parentElement)) opened.classList.remove("open");
  if (multi){ e.preventDefault(); multi.parentElement.classList.toggle("open"); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelector(".item.open")?.classList.remove("open");
  if (e.key === "Enter" && e.target.matches("[data-multi]")) e.target.click();
});
$("#q").addEventListener("input", render);
fetch("videos.json", {cache: "no-cache"}).then(r => r.json()).then(d => { items = d; renderShelves(); renderTags(); render(); })
  .catch(() => { $("#empty").hidden = false; });
</script>
</body>
</html>
