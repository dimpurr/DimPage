<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Dimpurr Cheny</title>
  <meta name="author" content="dimpurr" />
  <meta name="description" content="Dimpurr Cheny — artist, designer, developer" />
  <link rel="shortcut icon" href="res/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
  <script>
    // 首帧前定下主题，避免暗色用户看到白屏闪烁（FOUC）
    try {
      var _t = localStorage.getItem('dp-theme') ||
        (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = _t;
    } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light;
      --bg:         #ffffff;
      --surface:    #f6f9fc;
      --figure-bg:  #ffffff;   /* 图槽：图片的「相纸」 */
      --figure-line: transparent;
      --control-bg: #ffffff;   /* 按钮、chips */
      --ink:        #232d36;
      --muted:      #7d8b97;
      --faint:      #a8b4be;
      --line:       #e4ecf2;
      --accent:     #a9cbe8;
      --accent-ink: #5b8ab5;
      --accent-bg:  #e9f2fa;
      --shadow-card: 0 1px 2px rgba(35,60,90,.05), 0 6px 20px -8px rgba(35,60,90,.10);
      --shadow-lift: 0 2px 4px rgba(35,60,90,.06), 0 12px 28px -8px rgba(35,60,90,.16);
      --r-lg: 18px;
      --r-md: 14px;
      --r-pill: 999px;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
    }

    /* 暗色：与日间同一气质的「夜色纸张」——柔和的蓝灰深处，不纯黑、不高冷 */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg:         #161d26;
      --surface:    #1c2530;
      --figure-bg:  #27313d;   /* 图槽：与 surface 同族、再亮一档的冷中性灰蓝，柔和不刺眼 */
      --figure-line: #33404e;  /* 暗底上图槽与 surface 明度差小，用 1px 描边补出「瓷砖」边界 */
      --control-bg: #242f3c;
      --ink:        #e3eaf1;
      --muted:      #96a5b2;
      --faint:      #677682;
      --line:       #2d3947;
      --accent:     #7ba7cd;
      --accent-ink: #a5c8e8;
      --accent-bg:  #223341;
      --shadow-card: 0 1px 2px rgba(0,0,0,.22), 0 6px 20px -8px rgba(0,0,0,.38);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.28), 0 12px 28px -8px rgba(0,0,0,.5);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      overflow-x: clip;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 200ms ease-out, color 200ms ease-out;
    }

    /* ── intro ── */
    main { width: 100%; flex: 1; }

    .intro-wrap {
      max-width: 1320px; margin: 0 auto;
      padding: 13vh clamp(1.25rem, 4vw, 3rem) 4.5rem;
    }
    .intro { max-width: 560px; position: relative; }
    /* 手账感的淡蓝色块：非对称圆角，只做装饰 */
    .intro::before {
      content: ''; position: absolute; z-index: -1;
      top: -64px; left: -20px; width: 215px; height: 215px;
      background: var(--accent-bg);
      border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%;
    }
    /* 左偏移永远不超过 .intro-wrap 左内边距（min 1.25rem / 4vw / 居中边距），
       从根上不越界；body 的 overflow-x: clip 只作兜底，不再依赖它 */
    @media (min-width: 768px) { .intro::before { left: -30px; } }
    @media (min-width: 1400px) { .intro::before { left: -88px; } }

    .subtitle {
      font-size: 0.82rem; color: var(--muted); letter-spacing: 0.14em;
      margin-bottom: 0.9rem;
    }
    .name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 400; letter-spacing: 0.005em; line-height: 1.08;
      margin-bottom: 0.7rem;
    }
    .name em { font-style: italic; color: var(--accent-ink); }
    .bio { font-size: 0.98rem; color: var(--muted); line-height: 1.65; margin-bottom: 3rem; }

    .blog-label {
      font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--faint); margin: 1.6rem 0 0.5rem;
    }
    .blog-link {
      display: inline-block; font-size: 0.95rem; color: var(--ink);
      text-decoration: none; border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      transition: color 160ms ease-out, border-color 160ms ease-out;
    }
    .blog-link:hover { color: var(--accent-ink); border-color: var(--accent); }

    /* ── top-right controls: theme + language ── */
    .top-controls {
      position: fixed; top: 1.4rem; right: 1.5rem; z-index: 10;
      display: flex; gap: 0.5rem; align-items: center;
    }
    .top-controls button {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--control-bg); border: 1px solid var(--line); border-radius: var(--r-pill);
      color: var(--muted); font-family: inherit; font-size: 0.75rem; letter-spacing: 0.1em;
      padding: 0.42rem 0.95rem; cursor: pointer; box-shadow: var(--shadow-card);
      transition: color 160ms ease-out, border-color 160ms ease-out,
                  background-color 200ms ease-out;
    }
    .top-controls button:hover { color: var(--accent-ink); border-color: var(--accent); }
    .theme-toggle svg { width: 15px; height: 15px; display: block; }

    /* ── collection ── */
    .collection {
      background: var(--surface);
      border-radius: 36px 36px 0 0;
      padding: 3rem clamp(1.25rem, 4vw, 3rem) 4.5rem;
      transition: background-color 200ms ease-out;
    }
    .collection-inner { max-width: 1320px; margin: 0 auto; }

    .tabs-major {
      display: flex; gap: 2.2rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .tabs-major button {
      display: inline-flex; align-items: center; gap: 0.55rem;
      background: none; border: none; padding: 0 0 6px; cursor: pointer;
      font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem;
      color: var(--faint); border-bottom: 2px solid transparent;
      transition: color 160ms ease-out, border-color 160ms ease-out;
    }
    .tabs-major button svg { width: 22px; height: 22px; flex: none; }
    .tabs-major button:hover { color: var(--ink); }
    .tabs-major button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    .tabs-minor {
      display: flex; gap: 0.55rem; margin-bottom: 2.2rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px;
    }
    .tabs-minor::-webkit-scrollbar { display: none; }
    .tabs-minor button {
      flex: none; background: var(--control-bg); border: 1px solid var(--line);
      border-radius: var(--r-pill); padding: 0.38rem 0.95rem; cursor: pointer;
      font-family: inherit; font-size: 0.8rem; letter-spacing: 0.03em;
      color: var(--muted);
      transition: color 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
    }
    .tabs-minor button:hover { color: var(--ink); border-color: var(--accent); }
    .tabs-minor button[aria-selected="true"] {
      background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink);
    }

    /* ── cards ── */
    .card { display: flex; flex-direction: column; }

    .card figure {
      background: var(--figure-bg); border: 1px solid var(--figure-line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 0.65rem;
    }
    .card.device figure { aspect-ratio: 1 / 1; padding: 1.15rem; }
    .card.device img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card.char figure { aspect-ratio: 2 / 1; }
    .card.char.tall figure { aspect-ratio: 5 / 8; padding: 0.8rem; }
    .card.char img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .card.char.tall img { object-fit: contain; }

    .card .t { font-size: 0.92rem; font-weight: 500; line-height: 1.35; }
    .card .s { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
    .card .y { font-size: 0.72rem; color: var(--faint); letter-spacing: 0.06em; margin-top: 0.25rem; }

    .missing { font-size: 0.7rem; color: var(--faint); padding: 0.5rem; text-align: center; }

    /* 设备：全部 1:1，等宽 grid 即可 */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.4rem; }

    /* 角色：2:1 横版与 5:8 竖版混排，用 CSS 多列瀑布流保持各自原始比例 */
    .masonry { columns: 2; column-gap: 1.4rem; }
    .masonry .card { break-inside: avoid; margin-bottom: 1.4rem; }

    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .masonry { columns: 3; }
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 1.6rem; }
      .masonry { columns: 4; column-gap: 1.6rem; }
      .masonry .card { margin-bottom: 1.6rem; }
    }
    @media (min-width: 1280px) {
      .grid { grid-template-columns: repeat(5, 1fr); }
      .masonry { columns: 5; }
    }

    /* ── motion：只动 transform/opacity，ease-out，stagger 40ms ── */
    .card {
      opacity: 0; transform: translateY(8px);
      animation: card-in 260ms var(--ease-out) forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes card-in { to { opacity: 1; transform: none; } }

    @media (hover: hover) and (pointer: fine) {
      .card figure { transition: transform 180ms ease-out, box-shadow 180ms ease-out; }
      .card img { transition: transform 180ms ease-out; }
      .card:hover figure { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
      .card:hover figure img { transform: scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: card-fade 200ms ease-out forwards; transform: none; }
      @keyframes card-fade { to { opacity: 1; } }
    }

    :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 4px; }

    /* ── footer ── */
    footer {
      width: 100%; max-width: 1320px; margin: 0 auto;
      padding: 2.5rem clamp(1.25rem, 4vw, 3rem) 4rem;
    }
    .archive-label {
      font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 1rem;
    }
    .archive-list { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem 1.9rem; }
    .archive-list a {
      font-size: 0.85rem; color: var(--muted); text-decoration: none; letter-spacing: 0.03em;
      transition: color 150ms ease-out;
    }
    .archive-list a:hover { color: var(--accent-ink); }
    .archive-list a span { font-size: 0.72rem; color: var(--faint); margin-left: 0.35em; }
  </style>
</head>
<body>

  <div class="top-controls">
    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Dark mode"></button>
    <button class="lang-toggle" id="langBtn" type="button">中文</button>
  </div>

  <main>
    <div class="intro-wrap">
      <div class="intro">
        <p class="subtitle">Dimpurr Cheny &nbsp;·&nbsp; 钉子</p>
        <h1 class="name">Artist, Designer<br><em>&amp; Developer</em></h1>
        <p class="bio" data-i18n="bio">KCL Digital Humanities PhD Candidate</p>

        <p class="blog-label" data-i18n="writing">Writing</p>
        <a class="blog-link" href="https://www.wribb.com/c/dimpurr" target="_blank" rel="noopener">Wribb — @dimpurr &nbsp;↗</a>
        <p class="blog-label" data-i18n="connect">Connect</p>
        <a class="blog-link" href="https://www.linkedin.com/in/dimchen/" target="_blank" rel="noopener">LinkedIn &nbsp;↗</a>
        <br>
        <a class="blog-link" href="https://x.com/myccyycy" target="_blank" rel="noopener">X &nbsp;↗</a>
      </div>
    </div>

    <section class="collection">
      <div class="collection-inner">
        <div class="tabs-major" id="tabsMajor" role="tablist"></div>
        <div class="tabs-minor" id="tabsMinor" role="tablist"></div>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>

  <footer>
    <p class="archive-label" data-i18n="archive">Archive</p>
    <ul class="archive-list">
      <li><a href="dp-flat">Homepage <span>2013–2014</span></a></li>
      <li><a href="dp-card">Homepage <span>2014–2015</span></a></li>
      <li><a href="dp-modern-final">Homepage <span>2015–2019</span></a></li>
      <li><a href="dp-dimchen">Homepage <span>2019–2025</span></a></li>
    </ul>
  </footer>

  <script src="data/devices.js"></script>
  <script src="data/characters.js"></script>
  <script>
  (function () {
    var I18N = {
      en: {
        bio: 'KCL Digital Humanities PhD Candidate',
        writing: 'Writing', connect: 'Connect', archive: 'Archive',
        devices: 'Things I Owned', characters: 'Characters I Like',
        all: 'All', headphone: 'Audio', phone: 'Phones',
        genshin: 'Genshin Impact', zzz: 'Zenless Zone Zero',
        na: 'N/A', noimg: 'no image yet',
        toggle: '中文',
        toDark: 'Dark mode', toLight: 'Light mode'
      },
      zh: {
        bio: '伦敦国王学院 数字人文 博士在读',
        writing: '写作', connect: '联络', archive: '历代主页',
        devices: '用过的东西', characters: '喜欢的角色',
        all: '全部', headphone: '音频', phone: '手机',
        genshin: '原神', zzz: '绝区零',
        na: '不详', noimg: '暂无图',
        toggle: 'EN',
        toDark: '夜间模式', toLight: '日间模式'
      }
    };

    var ICONS = {
      devices: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14.5h2.2a.8.8 0 0 1 .8.8v3.4a.8.8 0 0 1-.8.8H5a1 1 0 0 1-1-1v-4z"/><path d="M20 14.5h-2.2a.8.8 0 0 0-.8.8v3.4a.8.8 0 0 0 .8.8H19a1 1 0 0 0 1-1v-4z"/></svg>',
      characters: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5.4 19.5a6.6 6.6 0 0 1 13.2 0"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.8 12h2M19.2 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"/></svg>'
    };

    var MAJOR = [
      { key: 'devices',    minors: ['all', 'headphone', 'phone'], data: window.COLLE_DEVICES || [] },
      { key: 'characters', minors: ['all', 'genshin', 'zzz'],     data: window.COLLE_CHARACTERS || [] }
    ];

    // localStorage 不可用（隐私模式等）时静默降级为「只跟随系统、不记忆」
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    // 主题与语言：默认跟随系统，手动切换后以手动为准并记住
    var themeQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    var theme = store.get('dp-theme') || (themeQuery && themeQuery.matches ? 'dark' : 'light');
    var lang = store.get('dp-lang') ||
      ((navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
    var major = 0, minor = 'all';

    var $grid = document.getElementById('grid');
    var $maj = document.getElementById('tabsMajor');
    var $min = document.getElementById('tabsMinor');
    var $lang = document.getElementById('langBtn');
    var $theme = document.getElementById('themeBtn');

    function t(k) { return (I18N[lang] && I18N[lang][k]) || k; }

    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      // 图标与 aria-label 表示「点击后要去哪里」：日间显示月亮，夜间显示太阳
      $theme.innerHTML = theme === 'dark' ? ICONS.sun : ICONS.moon;
      var label = t(theme === 'dark' ? 'toLight' : 'toDark');
      $theme.setAttribute('aria-label', label);
      $theme.title = label;
    }

    $theme.onclick = function () {
      theme = theme === 'dark' ? 'light' : 'dark';
      store.set('dp-theme', theme);
      applyTheme();
    };
    // 没手动选过时，系统主题变化实时跟随；手动选过则以手动为准
    if (themeQuery && themeQuery.addEventListener) {
      themeQuery.addEventListener('change', function (e) {
        if (store.get('dp-theme')) return;
        theme = e.matches ? 'dark' : 'light';
        applyTheme();
      });
    }

    function card(item, isChar, i) {
      var el = document.createElement('div');
      el.className = 'card ' + (isChar ? 'char' : 'device') + (isChar && item.cat === 'zzz' ? ' tall' : '');
      // stagger 延迟封顶，长列表尾部不拖沓
      el.style.setProperty('--d', Math.min(i, 10) * 40 + 'ms');

      var fig = document.createElement('figure');
      var img = new Image();
      img.loading = 'lazy';
      img.alt = isChar ? item.name[lang] : item.name;
      img.src = item.img;
      img.onerror = function () {
        fig.innerHTML = '<span class="missing">' + t('noimg') + '</span>';
      };
      fig.appendChild(img);
      el.appendChild(fig);

      var tt = document.createElement('div');
      tt.className = 't';
      tt.textContent = isChar ? item.name[lang] : item.name;
      el.appendChild(tt);

      if (!isChar) {
        if (item.sub) { var s = document.createElement('div'); s.className = 's'; s.textContent = item.sub; el.appendChild(s); }
        var y = document.createElement('div'); y.className = 'y';
        y.textContent = item.year == null ? t('na') : item.year;
        el.appendChild(y);
      }
      return el;
    }

    function render() {
      var g = MAJOR[major];
      var isChar = g.key === 'characters';

      $maj.innerHTML = '';
      MAJOR.forEach(function (m, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = ICONS[m.key] + '<span>' + t(m.key) + '</span>';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', i === major ? 'true' : 'false');
        b.onclick = function () { major = i; minor = 'all'; render(); };
        $maj.appendChild(b);
      });

      $min.innerHTML = '';
      g.minors.forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = t(k);
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', k === minor ? 'true' : 'false');
        b.onclick = function () { minor = k; render(); };
        $min.appendChild(b);
      });

      var rows = g.data.filter(function (x) { return minor === 'all' || x.cat === minor; });
      if (isChar) {
        // XP 只用来排序，不展示
        rows = rows.slice().sort(function (a, b) { return (b.xp || 0) - (a.xp || 0); });
      } else {
        rows = rows.slice().sort(function (a, b) {
          if (a.year == null) return 1;
          if (b.year == null) return -1;
          return a.year - b.year;
        });
      }

      $grid.className = isChar ? 'masonry' : 'grid';
      $grid.innerHTML = '';
      rows.forEach(function (x, i) { $grid.appendChild(card(x, isChar, i)); });
    }

    function applyLang() {
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      $lang.textContent = t('toggle');
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      applyTheme(); // 切换语言后 aria-label/title 也要跟着换
      render();
    }

    $lang.onclick = function () {
      lang = lang === 'en' ? 'zh' : 'en';
      store.set('dp-lang', lang);
      applyLang();
    };

    applyTheme();
    applyLang();
  })();
  </script>

</body>
</html>
