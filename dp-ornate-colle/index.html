<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Dimpurr Cheny</title>
  <meta name="author" content="dimpurr" />
  <meta name="description" content="Dimpurr Cheny — artist, designer, developer" />
  <link rel="shortcut icon" href="res/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
  <script>
    // 首帧前定下主题，避免暗色用户看到白屏闪烁（FOUC）
    try {
      var _t = localStorage.getItem('dp-theme') ||
        (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = _t;
    } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light;
      --bg:         #ffffff;
      --surface:    #f6f9fc;
      --figure-bg:  #ffffff;   /* 图槽：图片的「相纸」 */
      --figure-line: transparent;
      --control-bg: #ffffff;   /* 按钮、chips */
      --ink:        #232d36;
      --muted:      #7d8b97;
      --faint:      #a8b4be;
      --line:       #e4ecf2;
      --accent:     #a9cbe8;
      --accent-ink: #5b8ab5;
      --accent-bg:  #e9f2fa;
      --shadow-card: 0 1px 2px rgba(35,60,90,.05), 0 6px 20px -8px rgba(35,60,90,.10);
      --shadow-lift: 0 2px 4px rgba(35,60,90,.06), 0 12px 28px -8px rgba(35,60,90,.16);
      --r-lg: 18px;
      --r-md: 14px;
      --r-pill: 999px;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
    }

    /* 暗色：与日间同一气质的「夜色纸张」——柔和的蓝灰深处，不纯黑、不高冷 */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg:         #161d26;
      --surface:    #1c2530;
      --figure-bg:  #27313d;   /* 图槽：与 surface 同族、再亮一档的冷中性灰蓝，柔和不刺眼 */
      --figure-line: #33404e;  /* 暗底上图槽与 surface 明度差小，用 1px 描边补出「瓷砖」边界 */
      --control-bg: #242f3c;
      --ink:        #e3eaf1;
      --muted:      #96a5b2;
      --faint:      #677682;
      --line:       #2d3947;
      --accent:     #7ba7cd;
      --accent-ink: #a5c8e8;
      --accent-bg:  #223341;
      --shadow-card: 0 1px 2px rgba(0,0,0,.22), 0 6px 20px -8px rgba(0,0,0,.38);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.28), 0 12px 28px -8px rgba(0,0,0,.5);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      overflow-x: clip;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 200ms ease-out, color 200ms ease-out;
    }

    /* ── intro ── */
    main { width: 100%; flex: 1; }

    .intro-wrap {
      max-width: 1320px; margin: 0 auto;
      padding: 13vh clamp(1.25rem, 4vw, 3rem) 4.5rem;
    }
    .intro { max-width: 560px; position: relative; }
    /* 手账感的淡蓝色块：非对称圆角，只做装饰 */
    .intro::before {
      content: ''; position: absolute; z-index: -1;
      top: -64px; left: -20px; width: 215px; height: 215px;
      background: var(--accent-bg);
      border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%;
    }
    /* 左偏移永远不超过 .intro-wrap 左内边距（min 1.25rem / 4vw / 居中边距），
       从根上不越界；body 的 overflow-x: clip 只作兜底，不再依赖它 */
    @media (min-width: 768px) { .intro::before { left: -30px; } }
    @media (min-width: 1400px) { .intro::before { left: -88px; } }

    .subtitle {
      font-size: 0.82rem; color: var(--muted); letter-spacing: 0.14em;
      margin-bottom: 0.9rem;
    }
    .name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 400; letter-spacing: 0.005em; line-height: 1.08;
      margin-bottom: 0.7rem;
    }
    .name em { font-style: italic; color: var(--accent-ink); }
    .bio { font-size: 0.98rem; color: var(--muted); line-height: 1.65; margin-bottom: 3rem; }

    .blog-label {
      font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--faint); margin: 1.6rem 0 0.5rem;
    }
    .blog-link {
      display: inline-block; font-size: 0.95rem; color: var(--ink);
      text-decoration: none; border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      transition: color 160ms ease-out, border-color 160ms ease-out;
    }
    .blog-link:hover { color: var(--accent-ink); border-color: var(--accent); }

    /* ── top-right controls: theme + language ── */
    .top-controls {
      position: fixed; top: 1.4rem; right: 1.5rem; z-index: 10;
      display: flex; gap: 0.5rem; align-items: center;
    }
    .top-controls button {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--control-bg); border: 1px solid var(--line); border-radius: var(--r-pill);
      color: var(--muted); font-family: inherit; font-size: 0.75rem; letter-spacing: 0.1em;
      padding: 0.42rem 0.95rem; cursor: pointer; box-shadow: var(--shadow-card);
      transition: color 160ms ease-out, border-color 160ms ease-out,
                  background-color 200ms ease-out;
    }
    .top-controls button:hover { color: var(--accent-ink); border-color: var(--accent); }
    .theme-toggle svg { width: 15px; height: 15px; display: block; }

    /* ── collection ──
       收藏区（tabs + 卡片流）吃满可用宽度，只留左右内边距；
       文本区（intro/footer）才保留 max-width 阅读宽 */
    .collection {
      background: var(--surface);
      border-radius: 36px 36px 0 0;
      padding: 3rem clamp(1.25rem, 4vw, 3rem) 4.5rem;
      transition: background-color 200ms ease-out;
    }

    .tabs-bar {
      display: flex; align-items: flex-end; gap: 1rem 2rem;
      flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .tabs-major {
      display: flex; gap: 2.2rem; flex-wrap: wrap; flex: 1 1 auto;
    }
    .tabs-major button {
      display: inline-flex; align-items: center; gap: 0.55rem;
      background: none; border: none; padding: 0 0 6px; cursor: pointer;
      font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem;
      color: var(--faint); border-bottom: 2px solid transparent;
      transition: color 160ms ease-out, border-color 160ms ease-out;
    }
    .tabs-major button svg { width: 22px; height: 22px; flex: none; }
    .tabs-major button:hover { color: var(--ink); }
    .tabs-major button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    /* 「查看完整清单」：大 tab 行右侧的安静胶囊链接 */
    .list-link {
      display: inline-flex; align-items: center; gap: 0.35rem;
      margin-left: auto; margin-bottom: 4px;
      font-size: 0.8rem; letter-spacing: 0.03em; color: var(--muted);
      text-decoration: none; background: var(--control-bg);
      border: 1px solid var(--line); border-radius: var(--r-pill);
      padding: 0.4rem 0.9rem; box-shadow: var(--shadow-card);
      transition: color 160ms ease-out, border-color 160ms ease-out;
    }
    .list-link:hover { color: var(--accent-ink); border-color: var(--accent); }
    .list-link svg { width: 12px; height: 12px; }
    .list-link[hidden] { display: none; }

    /* 小 tab（筛选）与视图切换同一行：chips 居左、分段控件居右，
       两种操作视觉分组——筛选是散开的胶囊，视图是一个整体容器 */
    .minor-row {
      display: flex; align-items: flex-start; gap: 0.8rem 1rem;
      flex-wrap: wrap; margin-bottom: 2.2rem;
    }
    .tabs-minor {
      flex: 1 1 auto; min-width: 0;
      display: flex; gap: 0.55rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px;
    }
    .tabs-view {
      flex: none; margin-left: auto; display: flex; gap: 2px; padding: 3px;
      background: var(--control-bg); border: 1px solid var(--line);
      border-radius: var(--r-pill); box-shadow: var(--shadow-card);
    }
    .tabs-view[hidden] { display: none; }
    .tabs-view button {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: none; border: none; border-radius: var(--r-pill);
      padding: 0.3rem 0.75rem; cursor: pointer;
      font-family: inherit; font-size: 0.78rem; letter-spacing: 0.03em;
      color: var(--muted);
      transition: color 150ms ease-out, background-color 150ms ease-out;
    }
    .tabs-view button svg { width: 14px; height: 14px; }
    .tabs-view button:hover { color: var(--ink); }
    .tabs-view button[aria-selected="true"] { background: var(--accent-bg); color: var(--accent-ink); }

    /* 排序切换：单个幽灵胶囊按钮（图标+当前模式文字），点击在两模式间切换。
       与视图切换的分段容器（多按钮一个整体）形态上明确区分 */
    .sort-toggle {
      flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 0.4rem;
      background: none; border: 1px dashed var(--line); border-radius: var(--r-pill);
      padding: 0.38rem 0.9rem; cursor: pointer;
      font-family: inherit; font-size: 0.78rem; letter-spacing: 0.03em; color: var(--muted);
      transition: color 150ms ease-out, border-color 150ms ease-out;
    }
    .sort-toggle[hidden] { display: none; }
    .sort-toggle svg { width: 13px; height: 13px; }
    .sort-toggle:hover { color: var(--accent-ink); border-color: var(--accent); }
    .tabs-minor::-webkit-scrollbar { display: none; }
    .tabs-minor button {
      flex: none; background: var(--control-bg); border: 1px solid var(--line);
      border-radius: var(--r-pill); padding: 0.38rem 0.95rem; cursor: pointer;
      font-family: inherit; font-size: 0.8rem; letter-spacing: 0.03em;
      color: var(--muted);
      transition: color 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
    }
    .tabs-minor button:hover { color: var(--ink); border-color: var(--accent); }
    .tabs-minor button[aria-selected="true"] {
      background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink);
    }

    /* ── cards ── */
    .card { display: flex; flex-direction: column; }
    a.card { text-decoration: none; color: inherit; }

    .card figure {
      position: relative;
      background: var(--figure-bg); border: 1px solid var(--figure-line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 0.65rem;
    }
    .card.device figure { aspect-ratio: 1 / 1; padding: 1.15rem; }
    .card.device img { max-width: 100%; max-height: 100%; object-fit: contain; }
    /* 角色卡池图比例差异大（2:1 横版 / 1:1.6 竖版混排），锁宽度、高度随图自适应，
       不锁高度也就不裁切画面；瀑布流天然消化高度差 */
    .card.char img { width: 100%; height: auto; display: block; }
    /* 电影/动画海报：统一 2:3 竖版，满幅裁切 */
    .card.poster figure { aspect-ratio: 2 / 3; }
    .card.poster img { width: 100%; height: 100%; object-fit: cover; }
    /* 游戏封面：Steam 2:3 竖版、Switch 1:1 方形，混排走瀑布流 */
    .card.game figure { aspect-ratio: 2 / 3; }
    .card.game.square figure { aspect-ratio: 1 / 1; }
    .card.game img { width: 100%; height: 100%; object-fit: cover; }
    /* 城市照片：横构图 3:2，满幅裁切 */
    .card.place figure { aspect-ratio: 3 / 2; }
    .card.place img { width: 100%; height: 100%; object-fit: cover; }

    /* 可点击卡片的小箭头徽章：hover 才浮出，不打扰静态视觉 */
    .card .go {
      position: absolute; top: 0.55rem; right: 0.55rem;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--control-bg); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-card);
      opacity: 0; transform: translateY(-3px);
      transition: opacity 160ms ease-out, transform 160ms ease-out;
    }
    .card .go svg { width: 12px; height: 12px; }

    .card .t { font-size: 0.92rem; font-weight: 500; line-height: 1.35; }
    .card .s { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
    .card .y { font-size: 0.72rem; color: var(--faint); letter-spacing: 0.06em; margin-top: 0.25rem; }
    /* 城市卡的 segs 时间段串可能很长，两行截断 */
    .card .s.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .missing { font-size: 0.7rem; color: var(--faint); padding: 0.5rem; text-align: center; }

    /* 比例统一的卡片流（设备/海报）：auto-fill 网格，
       列数随宽度自动增长，minmax 下限把列宽锁在合理区间 */
    .grid {
      display: grid; gap: 1.4rem;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    /* 比例混排的卡片流（角色/游戏）：CSS 多列瀑布流，
       column-width 与 grid 下限同档，列数同样随宽度自动增长 */
    .masonry { column-width: 150px; column-gap: 1.4rem; }
    .masonry .card { break-inside: avoid; margin-bottom: 1.4rem; }
    /* 城市卡片流：横构图照片，列宽下限略大于竖版卡片 */
    .pgrid {
      display: grid; gap: 1.4rem;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.6rem; }
      .masonry { column-width: 180px; column-gap: 1.6rem; }
      .masonry .card { margin-bottom: 1.6rem; }
      .pgrid { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 1.6rem; }
    }
    @media (min-width: 1600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
      .masonry { column-width: 215px; }
      .pgrid { grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); }
    }

    /* ── 地图视图：纯矢量世界地图（d3-geo + topojson，全部本地、零网络） ── */
    .map-wrap { position: relative; }
    .map-wrap svg { display: block; width: 100%; height: auto; border-radius: var(--r-lg); }
    .m-ocean { fill: var(--accent-bg); }
    .m-grat { fill: none; stroke: var(--line); stroke-width: 0.4; }
    .m-land { fill: var(--figure-bg); stroke: var(--line); stroke-width: 0.5; }
    .mk { cursor: pointer; }
    .mk .c { fill: var(--accent-ink); stroke: var(--bg); stroke-width: 1.4; }
    .mk.travel .c { fill: var(--bg); stroke: var(--accent-ink); stroke-width: 1.8; }
    .mk .halo { fill: none; stroke: var(--accent-ink); stroke-width: 1.2; opacity: 0; transition: opacity 150ms ease-out; }
    @media (hover: hover) and (pointer: fine) { .mk:hover .halo { opacity: 0.7; } }
    .mk.on .halo { opacity: 1; }
    .map-legend {
      position: absolute; left: 0.9rem; bottom: 0.8rem; display: flex; gap: 1.1rem;
      font-size: 0.72rem; color: var(--muted);
    }
    .lg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 0.35em; }
    .lg-dot.live { background: var(--accent-ink); }
    .lg-dot.travel { background: var(--bg); border: 1.8px solid var(--accent-ink); box-sizing: border-box; }
    .map-pop {
      position: absolute; z-index: 5; width: 210px;
      background: var(--control-bg); border: 1px solid var(--line);
      border-radius: var(--r-md); box-shadow: var(--shadow-lift); overflow: hidden;
    }
    .map-pop[hidden] { display: none; }
    .map-pop img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: var(--figure-bg); }
    .mp-t { padding: 0.6rem 0.75rem 0.7rem; }
    .mp-name { font-size: 0.88rem; font-weight: 500; }
    .mp-sub { font-size: 0.72rem; color: var(--faint); letter-spacing: 0.05em; margin-top: 0.2rem; }
    .mp-segs { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.5; }

    /* ── 时间轴视图：横轴为首次到访时间，居住在上、旅游在下 ── */
    .tl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tl-wrap::-webkit-scrollbar { display: none; }
    .tl-inner { position: relative; }
    .tl-wrap svg { display: block; }
    .tl-wrap text { font-family: inherit; }
    .tl-axis, .tl-tick { stroke: var(--line); stroke-width: 1; }
    .tl-tick-t { font-size: 10px; fill: var(--faint); letter-spacing: 0.04em; }
    .tl-conn { stroke: var(--accent); stroke-width: 0.8; opacity: 0.8; }
    .tl-it { cursor: pointer; }
    .tl-hit { fill: transparent; }   /* 隐形大热区，小圆点更好点 */
    .tl-dot { fill: var(--accent-ink); stroke: var(--bg); stroke-width: 1.2; }
    .tl-dot.travel { fill: var(--bg); stroke: var(--accent-ink); stroke-width: 1.6; }
    .tl-label { font-size: 11px; fill: var(--ink); }

    /* ── motion：只动 transform/opacity，ease-out，stagger 40ms ── */
    .card {
      opacity: 0; transform: translateY(8px);
      animation: card-in 260ms var(--ease-out) forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes card-in { to { opacity: 1; transform: none; } }

    @media (hover: hover) and (pointer: fine) {
      .card figure { transition: transform 180ms ease-out, box-shadow 180ms ease-out; }
      .card img { transition: transform 180ms ease-out; }
      .card:hover figure { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
      .card:hover figure img { transform: scale(1.02); }
      .card:hover .go { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: card-fade 200ms ease-out forwards; transform: none; }
      @keyframes card-fade { to { opacity: 1; } }
    }

    :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 4px; }

    /* ── footer ── */
    footer {
      width: 100%; max-width: 1320px; margin: 0 auto;
      padding: 2.5rem clamp(1.25rem, 4vw, 3rem) 4rem;
    }
    .archive-label {
      font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 1rem;
    }
    .archive-list { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem 1.9rem; }
    .archive-list a {
      font-size: 0.85rem; color: var(--muted); text-decoration: none; letter-spacing: 0.03em;
      transition: color 150ms ease-out;
    }
    .archive-list a:hover { color: var(--accent-ink); }
    .archive-list a span { font-size: 0.72rem; color: var(--faint); margin-left: 0.35em; }
  </style>
</head>
<body>

  <div class="top-controls">
    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Dark mode"></button>
    <button class="lang-toggle" id="langBtn" type="button">中文</button>
  </div>

  <main>
    <div class="intro-wrap">
      <div class="intro">
        <p class="subtitle">Dimpurr Cheny &nbsp;·&nbsp; 钉子</p>
        <h1 class="name">Artist, Designer<br><em>&amp; Developer</em></h1>

        <p class="blog-label" data-i18n="writing">Writing</p>
        <a class="blog-link" href="https://www.wribb.com/c/dimpurr" target="_blank" rel="noopener">Wribb — @dimpurr &nbsp;↗</a>
        <p class="blog-label" data-i18n="connect">Connect</p>
        <a class="blog-link" href="https://www.linkedin.com/in/dimchen/" target="_blank" rel="noopener">LinkedIn &nbsp;↗</a>
        <br>
        <a class="blog-link" href="https://x.com/myccyycy" target="_blank" rel="noopener">X &nbsp;↗</a>
      </div>
    </div>

    <section class="collection">
      <div class="tabs-bar">
        <div class="tabs-major" id="tabsMajor" role="tablist"></div>
        <a class="list-link" id="listLink" href="#" target="_blank" rel="noopener" hidden></a>
      </div>
      <div class="minor-row">
        <div class="tabs-minor" id="tabsMinor" role="tablist"></div>
        <button class="sort-toggle" id="sortBtn" type="button" hidden></button>
        <div class="tabs-view" id="tabsView" role="group" aria-label="View" hidden></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="map-wrap" id="mapWrap" hidden>
        <svg id="mapSvg" role="img" aria-label="World map"></svg>

      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.8 12h2M19.2 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"/></svg>',
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9.5 7H17v7.5"/></svg>'
    };

    // posters: 统一 2:3 竖版海报墙（等宽 grid）；masonry: 比例混排走瀑布流；
    // list: 「完整清单」外链；score/score2/xp 只排序不展示
    var MAJOR = [
      { key: 'devices',    minors: ['all', 'headphone', 'phone', 'computer', 'console', 'peripheral'], data: window.COLLE_DEVICES || [] },
      { key: 'characters', minors: ['all', 'genshin', 'zzz'],     data: window.COLLE_CHARACTERS || [], masonry: true },
      { key: 'movies',     minors: ['all'], posters: true,        data: window.COLLE_MOVIES || [],
        list: 'https://movie.douban.com/people/dimpurr/collect' },
      { key: 'anime',      minors: ['all', 'animetv', 'animefilm'], posters: true, data: window.COLLE_ANIME || [],
        list: 'https://bgm.tv/anime/list/myccyycy/collect' },
      { key: 'games',      minors: ['all', 'steam', 'switch'],    data: window.COLLE_GAMES || [], masonry: true,
        list: 'https://steamcommunity.com/id/dimpurr/' },
      { key: 'places',     minors: ['all', 'live', 'travel'],     data: window.COLLE_PLACES || [] },
      { key: 'books',      minors: ['all', 'novel', 'manga', 'douban'], posters: true, data: window.COLLE_BOOKS || [] },
      { key: 'physical',   minors: ['all', 'disc', 'booklondon'], posters: true, data: window.COLLE_PHYSICAL || [] },
      { key: 'events',     minors: ['all', 'concert', 'stage', 'exhibition'], data: window.COLLE_EVENTS || [] },
      { key: 'glam',       minors: ['all'],                       data: window.COLLE_GLAM || [] },
      { key: 'campus',     minors: ['all'],                       data: window.COLLE_CAMPUS || [] }
    ];

    // localStorage 不可用（隐私模式等）时静默降级为「只跟随系统、不记忆」
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    // 主题与语言：默认跟随系统，手动切换后以手动为准并记住
    var themeQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    var theme = store.get('dp-theme') || (themeQuery && themeQuery.matches ? 'dark' : 'light');
    var lang = store.get('dp-lang') ||
      ((navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
    var major = 0, minor = 'all';

    var $grid = document.getElementById('grid');
    var $maj = document.getElementById('tabsMajor');
    var $min = document.getElementById('tabsMinor');
    var $lang = document.getElementById('langBtn');
    var $theme = document.getElementById('themeBtn');
    var $list = document.getElementById('listLink');
    var $view = document.getElementById('tabsView');
    var $mapWrap = document.getElementById('mapWrap');
    var $mapSvg = document.getElementById('mapSvg');
    var $mapLegend = document.getElementById('mapLegend');
    var $mapPop = document.getElementById('mapPop');
    var $tlWrap = document.getElementById('tlWrap');
    var view = 'cards';   // places 大 tab 的视图：cards / map / time
    var placeRows = [];   // places 当前筛选结果，resize 重绘矢量视图用
    var mapSel = null;    // 地图弹窗当前条目 id
    // 排序切换：只有 Dim 点名的三个 tab 支持，评分键各异；分数永远不展示给读者
    var SORT_KEY = { anime: 'score', movies: 'score', glam: 'rank' };
    var sort = 'score';   // 'score' 按评分（默认）/ 'time' 按时间
    var $sort = document.getElementById('sortBtn');

    function t(k) { return (I18N[lang] && I18N[lang][k]) || k; }

    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      // 图标与 aria-label 表示「点击后要去哪里」：日间显示月亮，夜间显示太阳
      $theme.innerHTML = theme === 'dark' ? ICONS.sun : ICONS.moon;
      var label = t(theme === 'dark' ? 'toLight' : 'toDark');
      $theme.setAttribute('aria-label', label);
      $theme.title = label;
    }

    $theme.onclick = function () {
      theme = theme === 'dark' ? 'light' : 'dark';
      store.set('dp-theme', theme);
      applyTheme();
    };
    // 没手动选过时，系统主题变化实时跟随；手动选过则以手动为准
    if (themeQuery && themeQuery.addEventListener) {
      themeQuery.addEventListener('change', function (e) {
        if (store.get('dp-theme')) return;
        theme = e.matches ? 'dark' : 'light';
        applyTheme();
      });
    }

    function card(item, g, i) {
      var isChar = g.key === 'characters';
      var isPlace = g.key === 'places';
      // 有 url 的条目整张卡就是链接；url 为 null（如 Switch 游戏）则不可点、无徽章
      var el = document.createElement(item.url ? 'a' : 'div');
      var type = isChar ? 'char' : isPlace ? 'place' : g.posters ? 'poster' : g.key === 'games' ? 'game' : 'device';
      el.className = 'card ' + type +
        (isChar && item.cat === 'zzz' ? ' tall' : '') +
        (type === 'game' && item.cat === 'switch' ? ' square' : '');
      if (item.url) { el.href = item.url; el.target = '_blank'; el.rel = 'noopener'; }
      // stagger 延迟封顶，长列表尾部不拖沓
      el.style.setProperty('--d', Math.min(i, 10) * 40 + 'ms');

      var fig = document.createElement('figure');
      var img = new Image();
      img.loading = 'lazy';
      img.alt = typeof item.name === 'object' ? item.name[lang] : item.name;
      img.src = item.img;
      img.onerror = function () {
        fig.innerHTML = '<span class="missing">' + t('noimg') + '</span>';
      };
      fig.appendChild(img);
      if (item.url) {
        var go = document.createElement('span');
        go.className = 'go'; go.innerHTML = ICONS.arrow; go.setAttribute('aria-hidden', 'true');
        fig.appendChild(go);
      }
      el.appendChild(fig);

      var tt = document.createElement('div');
      tt.className = 't';
      tt.textContent = typeof item.name === 'object' ? item.name[lang] : item.name;
      el.appendChild(tt);

      if (item.sub) {
        var s = document.createElement('div'); s.className = 's'; s.textContent = item.sub;
        el.appendChild(s);
      }
      if (isPlace) {
        // 城市卡：segs 是已排版的时间段串（两行截断），国旗/国家/首访年份做三级行；
        // days / photos 是隐性排序键，与 xp 同规——永远不展示
        if (item.segs) {
          var ps = document.createElement('div'); ps.className = 's clamp'; ps.textContent = item.segs;
          el.appendChild(ps);
        }
        var py = document.createElement('div'); py.className = 'y';
        py.textContent = (item.flag ? item.flag + ' ' : '') +
          (item.country ? item.country[lang] : '') + ' · ' + (item.year == null ? t('na') : item.year);
        el.appendChild(py);
      } else if (item.year !== undefined) {
        var y = document.createElement('div'); y.className = 'y';
        y.textContent = item.year == null ? t('na') : item.year;
        el.appendChild(y);
      }
      return el;
    }

    function render() {
      var g = MAJOR[major];
      var isChar = g.key === 'characters';

      $maj.innerHTML = '';
      MAJOR.forEach(function (m, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = ICONS[m.key] + '<span>' + t(m.key) + '</span>';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', i === major ? 'true' : 'false');
        b.onclick = function () { major = i; minor = 'all'; render(); };
        $maj.appendChild(b);
      });

      // 「查看完整清单」：仅当前大 tab 配置了清单外链时显示；
      // 游戏 tab 无论小 tab 是 Steam 还是 Switch 都统一指向 Steam 个人主页
      if (g.list) {
        $list.hidden = false;
        $list.href = g.list;
        $list.innerHTML = t('fullist') + ICONS.arrow;
      } else {
        $list.hidden = true;
      }

      // 只有一个分类的大 tab 不渲染小 tab 行
      $min.innerHTML = '';
      $min.style.display = g.minors.length > 1 ? '' : 'none';
      g.minors.forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = t(k);
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', k === minor ? 'true' : 'false');
        b.onclick = function () { minor = k; render(); };
        $min.appendChild(b);
      });

      var rows = g.data.filter(function (x) { return minor === 'all' || x.cat === minor; });
      if (isChar) {
        // XP 只用来排序，不展示
        rows = rows.slice().sort(function (a, b) { return (b.xp || 0) - (a.xp || 0); });
      } else if (g.key === 'devices') {
        rows = rows.slice().sort(function (a, b) {
          if (a.year == null) return 1;
          if (b.year == null) return -1;
          return b.year - a.year;
        });
      }
      // 电影/动画/游戏/地点：数据已按分数（时长/天数）降序排好，保持原顺序；数值不展示

      // 视图切换：只有 places 大 tab 有，与小 tab（筛选）同行居右
      var isPlace = g.key === 'places';
      $view.hidden = !isPlace;
      if (isPlace) renderViewTabs();

      // 排序切换：仅 glam/anime/movies 三个 tab；单按钮两模式，与视图分段控件形态区分
      var sortKey = SORT_KEY[g.key];
      $sort.hidden = !sortKey;
      if (sortKey) {
        $sort.innerHTML = ICONS.sort + '<span>' + t(sort === 'time' ? 'sortTime' : 'sortScore') + '</span>';
        rows = rows.slice().sort(function (a, b) {
          if (sort === 'time') {
            if (a.year == null) return 1;
            if (b.year == null) return -1;
            return b.year - a.year;
          }
          // 按评分：隐性分数键降序，缺键排最后；稳定排序，同分保持数据原顺序
          var av = a[sortKey], bv = b[sortKey];
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          return bv - av;
        });
      }

      var showCards = !isPlace || view === 'cards';
      $grid.style.display = showCards ? '' : 'none';
      $mapWrap.hidden = !(isPlace && view === 'map');
      $tlWrap.hidden = !(isPlace && view === 'time');
      if (!isPlace || view !== 'map') { mapSel = null; $mapPop.hidden = true; }

      if (isPlace) {
        placeRows = rows;
        if (view === 'map') { renderMap(rows); return; }
        if (view === 'time') { renderTimeline(rows); return; }
      }

      $grid.className = isPlace ? 'pgrid' : g.masonry ? 'masonry' : 'grid';
      $grid.innerHTML = '';
      rows.forEach(function (x, i) { $grid.appendChild(card(x, g, i)); });
    }

    // ── 视图切换（places 专属）：筛选与视图是两种操作，分段控件整体居右 ──
    var VIEWS = ['cards', 'map', 'time'];
    function renderViewTabs() {
      $view.innerHTML = '';
      VIEWS.forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = ICONS['view_' + v] + '<span>' + t('v' + v) + '</span>';
        b.setAttribute('aria-selected', v === view ? 'true' : 'false');
        b.onclick = function () { view = v; render(); };
        $view.appendChild(b);
      });
    }

    $sort.onclick = function () { sort = sort === 'time' ? 'score' : 'time'; render(); };

    // ── 地图视图：d3-geo Natural Earth 投影 + topojson 110m 国界，
    //    全部本地矢量、零网络；颜色走 CSS 变量，日夜切换无需重绘 ──
    function renderMap(rows) {
      var W = $mapWrap.clientWidth;
      if (!W) return;
      var H = Math.max(230, Math.round(W * 0.5));
      var proj = d3.geoNaturalEarth1().fitExtent([[6, 12], [W - 6, H - 6]], { type: 'Sphere' });
      var path = d3.geoPath(proj);
      var land = topojson.feature(window.WORLD_110M, window.WORLD_110M.objects.countries);

      $mapSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      $mapSvg.innerHTML =
        '<path class="m-ocean" d="' + path({ type: 'Sphere' }) + '"></path>' +
        '<path class="m-grat" d="' + path(d3.geoGraticule10()) + '"></path>' +
        '<path class="m-land" d="' + path(land) + '"></path>';
      $mapSvg.onclick = function () { mapSel = null; $mapPop.hidden = true; syncMarks(); };

      var SVGNS = 'http://www.w3.org/2000/svg';
      rows.forEach(function (p) {
        if (p.lat == null || p.lon == null) return;
        var pt = proj([p.lon, p.lat]);
        var mk = document.createElementNS(SVGNS, 'g');
        mk.setAttribute('class', 'mk' + (p.cat === 'travel' ? ' travel' : ''));
        mk.setAttribute('transform', 'translate(' + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) + ')');
        mk.setAttribute('data-id', p.id);
        mk.innerHTML = '<circle class="halo" r="9"></circle><circle class="c" r="4"></circle>';
        var ti = document.createElementNS(SVGNS, 'title');
        ti.textContent = p.name[lang] + (p.segs ? ' · ' + p.segs : '');
        mk.appendChild(ti);
        mk.addEventListener('click', function (ev) {
          ev.stopPropagation();
          togglePop(p, pt, W);
        });
        $mapSvg.appendChild(mk);
      });
      syncMarks();

      $mapLegend.innerHTML =
        '<span><i class="lg-dot live"></i>' + t('live') + '</span>' +
        '<span><i class="lg-dot travel"></i>' + t('travel') + '</span>';
    }

    function syncMarks() {
      $mapSvg.querySelectorAll('.mk').forEach(function (m) {
        m.classList.toggle('on', m.getAttribute('data-id') === mapSel);
      });
    }

    // 弹卡内容与定位：地图（带图）与时间轴（纯文字）共用
    function popHTML(p, withImg) {
      return (withImg
          ? '<img src="' + p.img + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '<div class="mp-t">' +
          '<div class="mp-name">' + (p.flag ? p.flag + ' ' : '') + p.name[lang] + '</div>' +
          '<div class="mp-sub">' + (p.country ? p.country[lang] : '') + ' · ' +
            (p.year == null ? t('na') : p.year) + '</div>' +
          (p.segs ? '<div class="mp-segs">' + p.segs + '</div>' : '') +
        '</div>';
    }
    function placePop($pop, x, y, W, above) {
      var half = 111; // 弹卡半宽 105 + 安全边距
      $pop.style.left = Math.min(Math.max(x, half), W - half) + 'px';
      $pop.style.top = y + 'px';
      $pop.style.transform = above
        ? 'translate(-50%, calc(-100% - 12px))'
        : 'translate(-50%, 14px)';
      $pop.hidden = false;
    }

    // 地图点位弹卡：照片 + 名称 + 国家/首访 + 时间段；靠近顶部时翻转到点下方
    function togglePop(p, pt, W) {
      if (mapSel === p.id && !$mapPop.hidden) { mapSel = null; $mapPop.hidden = true; syncMarks(); return; }
      mapSel = p.id;
      $mapPop.innerHTML = popHTML(p, true);
      placePop($mapPop, pt[0], pt[1], W, pt[1] > 170);
      syncMarks();
    }

    // ── 时间轴视图：横轴为首次到访时间，居住在上、旅游在下，标签分层避让 ──
    function estW(s) {
      var w = 0;
      for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 0x2e7f ? 11 : 6.4;
      return w + 10;
    }

    function renderTimeline(rows) {
      var wrapW = $tlWrap.clientWidth;
      if (!wrapW) return;
      var W = Math.max(wrapW, 1700), pad = 40, axisY = 112;
      var items = [];
      rows.forEach(function (p) {
        if (!p.first) return;
        var ym = p.first.split('-');
        items.push({ p: p, v: (+ym[0]) + ((+ym[1] || 1) - 1) / 12, m: +ym[1] || 1 });
      });
      if (!items.length) { $tlWrap.innerHTML = ''; return; }
      items.sort(function (a, b) { return a.v - b.v; });
      var minV = Math.floor(items[0].v) - 0.4;
      var maxV = Math.ceil(items[items.length - 1].v) + 0.6;
      var sx = function (v) { return pad + (v - minV) / (maxV - minV) * (W - pad * 2); };
      var dotYOf = function (it) {
        // 旅游点按月份在轴下方条带内纵向散开，密集年份（如 2022 的 17 段）自然成簇
        return it.p.cat === 'live' ? axisY - 10 : axisY + 14 + (it.m - 1) / 11 * 30;
      };
      var H = 252;

      var s = '<div class="tl-inner" style="width:' + W + 'px">' +
              '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px" role="img">';
      // 年刻度每 5 年，标签放在轴下方保留条带内，不与旅游泳道抢位置
      for (var yr = Math.ceil(minV / 5) * 5; yr <= maxV; yr += 5) {
        var tx = sx(yr);
        s += '<line class="tl-tick" x1="' + tx + '" y1="' + (axisY - 4) + '" x2="' + tx + '" y2="' + (axisY + 4) + '"></line>' +
             '<text class="tl-tick-t" x="' + tx + '" y="' + (axisY + 18) + '" text-anchor="middle">' + yr + '</text>';
      }
      s += '<line class="tl-axis" x1="' + (pad - 14) + '" y1="' + axisY + '" x2="' + (W - pad + 14) + '" y2="' + axisY + '"></line>';

      // 居住泳道（上）条目少，标签最多两层总能放下；
      // 旅游泳道（下）标签贪心两层，放不下的就只留点——悬停有提示、点击弹文字卡
      var last = { live: [-1e9, -1e9], travel: [-1e9, -1e9] };
      items.forEach(function (it, i) {
        var p = it.p, isLive = p.cat === 'live';
        var x = sx(it.v), dotY = dotYOf(it);
        s += '<g class="tl-it" data-i="' + i + '">' +
          '<title>' + p.name[lang] + (p.segs ? ' · ' + p.segs : '') + '</title>' +
          '<circle class="tl-hit" cx="' + x + '" cy="' + dotY + '" r="9"></circle>' +
          '<circle class="tl-dot' + (isLive ? '' : ' travel') + '" cx="' + x + '" cy="' + dotY + '" r="3.6"></circle>';
        var label = (p.flag ? p.flag + ' ' : '') + p.name[lang];
        var w = estW(label);
        var lane = isLive ? last.live : last.travel;
        for (var k = 0; k < 2; k++) {
          if (x - w / 2 - 8 > lane[k]) {
            var ly = isLive ? axisY - 28 - k * 22 : axisY + 62 + k * 22;
            s += '<line class="tl-conn" x1="' + x + '" y1="' + dotY + '" x2="' + x +
                 '" y2="' + (isLive ? ly + 9 : ly - 11) + '"></line>' +
                 '<text class="tl-label" x="' + x + '" y="' + ly + '" text-anchor="middle">' + label + '</text>';
            lane[k] = x + w / 2;
            break;
          }
        }
        s += '</g>';
      });
      s += '</svg><div class="map-pop" id="tlPop" hidden></div></div>';
      $tlWrap.innerHTML = s;

      // 点弹文字卡（无图，体积小）：居住点弹下方、旅游点弹上方，都不会被裁
      var $tlPop = document.getElementById('tlPop');
      $tlWrap.querySelector('svg').addEventListener('click', function (ev) {
        var g = ev.target.closest ? ev.target.closest('g[data-i]') : null;
        if (!g) { $tlPop.hidden = true; return; }
        ev.stopPropagation();
        var it = items[+g.getAttribute('data-i')];
        if ($tlPop.getAttribute('data-id') === it.p.id && !$tlPop.hidden) { $tlPop.hidden = true; return; }
        $tlPop.setAttribute('data-id', it.p.id);
        $tlPop.innerHTML = popHTML(it.p, false);
        placePop($tlPop, sx(it.v), dotYOf(it), W, it.p.cat !== 'live');
      });
    }

    // 矢量视图尺寸由容器宽度驱动，视口变化时防抖重绘
    var rsTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(rsTimer);
      rsTimer = setTimeout(function () {
        if (MAJOR[major].key !== 'places') return;
        if (view === 'map') renderMap(placeRows);
        else if (view === 'time') renderTimeline(placeRows);
      }, 180);
    });

    function applyLang() {
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      $lang.textContent = t('toggle');
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      applyTheme(); // 切换语言后 aria-label/title 也要跟着换
      render();
    }

    $lang.onclick = function () {
      lang = lang === 'en' ? 'zh' : 'en';
      store.set('dp-lang', lang);
      applyLang();
    };

    applyTheme();
    applyLang();
  })();
  </script>

</body>
</html>
